repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        pass_filenames: false
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        pass_filenames: false
        language: system
        types: [rust]

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets --all-features
        pass_filenames: false
        language: system
        types: [rust]

      - id: cargo-test
        name: cargo test
        entry: cargo test --all
        pass_filenames: false
        language: system
        types: [rust]
