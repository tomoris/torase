[project]
name = "artificial-language"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mypy>=1.15.0",
    "nltk>=3.9.1",
    "ruff>=0.11.2",
]

[tool.ruff.lint]
ignore = [
  "E501", # Line too long
]

select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
]
